<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mantle Vector Graphics Demo</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #0f0f14;
        color: #e0e0e0;
        font-family: 'Inter', system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 32px 16px;
      }
      h1 {
        font-size: 1.8rem;
        font-weight: 700;
        background: linear-gradient(135deg, #7c8cff, #c08bff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 24px;
      }
      .card {
        background: #1a1a26;
        border: 1px solid #2d2d44;
        border-radius: 14px;
        padding: 24px;
        width: 100%;
        max-width: 720px;
        margin-bottom: 20px;
      }
      h2 {
        font-size: 1rem;
        color: #aab;
        margin-bottom: 14px;
      }
      .file-row {
        display: flex;
        gap: 10px;
        margin-bottom: 10px;
        align-items: center;
      }
      label {
        font-size: 0.78rem;
        color: #888;
        width: 90px;
      }
      input[type='file'] {
        flex: 1;
        background: #252535;
        border: 1px solid #383858;
        border-radius: 8px;
        padding: 6px 10px;
        color: #ccd;
        font-size: 0.78rem;
      }
      button#load-btn {
        width: 100%;
        padding: 11px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #5a6fff, #9a55ff);
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      button#load-btn:hover {
        opacity: 0.85;
      }
      /* 1:1 with the backing store (800x800), so what you look at IS what was rendered. On a
         window too narrow for 800px the browser scales it down again — the status line says so. */
      #canvas-wrap {
        position: relative;
        width: 800px;
        max-width: 100%;
        aspect-ratio: 1;
        overflow: hidden;
        border: 1px solid #2d2d44;
        background: conic-gradient(
            #d8d8e0 90deg,
            #f4f4f8 90deg 180deg,
            #d8d8e0 180deg 270deg,
            #f4f4f8 270deg
          )
          0 0 / 20px 20px;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .debug-legend {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px 16px;
        margin-top: 10px;
        padding: 10px 12px;
        background: #14141c;
        border: 1px solid #2d2d44;
        border-radius: 8px;
        font-size: 0.72rem;
        color: #889;
      }
      .debug-legend span.legend-label {
        color: #667;
        margin-right: 4px;
      }
      .debug-legend .lg {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .debug-legend i.sw {
        display: inline-block;
        width: 14px;
        height: 14px;
        border-radius: 3px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        flex-shrink: 0;
      }
      button.secondary {
        padding: 8px;
        border: 1px solid #383858;
        border-radius: 8px;
        background: #1e1e30;
        color: #aab;
        font-size: 0.8rem;
        cursor: pointer;
      }
      button.secondary.active {
        background: #2a2a50;
        color: #9ab;
      }
    </style>
  </head>
  <body>
    <h1>Mantle Vector Graphics</h1>

    <div class="card">
      <h2>Render SVG</h2>
      <!-- Every SVG the smoke suite renders, as a real file, so the asset you most want to look
       at when a smoke goes red is one you can open. -->
      <div class="file-row" style="align-items: center">
        <label for="smoke-sel" style="white-space: nowrap">Asset</label>
        <select
          id="smoke-sel"
          style="
            flex: 1;
            min-width: 0;
            padding: 6px 8px;
            background: #252535;
            border: 1px solid #383858;
            border-radius: 8px;
            color: #ccd;
            font-size: 0.78rem;
          "
        >
          <option value="">— pick a scene —</option>
          <optgroup id="grp-examples" label="Examples"></optgroup>
          <optgroup id="grp-smoke" label="Smoke-suite assets"></optgroup>
        </select>
      </div>
      <div class="file-row">
        <label>.svg</label><input id="svg-file" type="file" accept=".svg,image/svg+xml" />
      </div>
      <button id="svg-btn" type="button" style="width: 100%; padding: 8px; margin-top: 4px">
        Convert &amp; render SVG in browser
      </button>
      <div style="display: flex; gap: 8px; margin-top: 8px">
        <button id="debug-tri" class="secondary" type="button" style="flex: 1">
          Outline triangles
        </button>
        <button id="debug-bbox" class="secondary" type="button" style="flex: 1">
          Shape bboxes
        </button>
      </div>
      <!-- The overlay draws the mesh the frame actually SUBMITTED, so it follows the engine: the
       Slug cover mesh under Slug/AAC/GWN, the Loop-Blinn partition under LB. -->
      <div class="debug-legend" aria-label="Debug polygon overlay colors">
        <span class="legend-label">Overlay</span>
        <span class="lg"
          ><i class="sw" style="background: rgba(255, 210, 0, 0.95)"></i> Interior triangles</span
        >
        <span class="lg"
          ><i class="sw" style="background: rgba(255, 38, 38, 0.95)"></i> Curve pieces (hulls /
          crescents)</span
        >
        <span class="lg"
          ><i class="sw" style="background: rgba(26, 179, 255, 0.95)"></i> LB AA strips &amp;
          caps</span
        >
        <span class="lg"
          ><i class="sw" style="background: rgba(199, 96, 5, 0.95)"></i> Shape bbox</span
        >
      </div>
      <div style="display: flex; gap: 8px; margin-top: 12px; align-items: center; flex-wrap: wrap">
        <button id="bench-btn" class="secondary" type="button" style="flex: 1; min-width: 120px">
          Benchmark
        </button>
        <label for="bench-n" style="width: auto; font-size: 0.72rem; color: #888; flex-shrink: 0"
          >Frames</label
        >
        <input
          id="bench-n"
          type="number"
          value="200"
          min="1"
          max="20000"
          style="
            width: 70px;
            padding: 6px 8px;
            background: #252535;
            border: 1px solid #383858;
            border-radius: 8px;
            color: #ccd;
            font-size: 0.8rem;
            text-align: center;
          "
        />
      </div>
      <div id="status" style="margin-top: 12px; font-size: 0.8rem; color: #aab">
        Waiting for files…
      </div>
    </div>

    <div class="card">
      <h2>Engine &amp; optimizations</h2>
      <div
        style="display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap"
      >
        <label for="eng-sel" style="width: auto; font-size: 0.72rem; color: #888"
          >Fill engine</label
        >
        <select
          id="eng-sel"
          style="
            flex: 1;
            min-width: 150px;
            padding: 6px 8px;
            background: #252535;
            border: 1px solid #383858;
            border-radius: 8px;
            color: #ccd;
            font-size: 0.8rem;
          "
        >
          <option value="auto">Auto (per-bundle gate)</option>
          <option value="slug">Slug (band walk)</option>
          <option value="lb">Loop-Blinn</option>
          <option value="lb-only">Loop-Blinn (FORCE — no Slug fallback)</option>
          <option value="aac">AAC (analytic area)</option>
          <option value="gwn">GWN + SDF (band-free)</option>
          <option value="hard">No-AA (hard band)</option>
          <option value="hard-tree">No-AA (GWN hard tree)</option>
        </select>
        <label style="width: auto; font-size: 0.72rem; color: #888">Res scale</label>
        <input
          id="res-scale"
          type="range"
          min="0.25"
          max="1"
          step="0.05"
          value="1"
          style="flex: 1; min-width: 110px"
        />
        <span id="res-scale-v" style="font-size: 0.72rem; color: #889; min-width: 5.5em"
          >1.00×</span
        >
      </div>
      <div
        id="opt-toggles"
        style="
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 6px 12px;
          font-size: 0.75rem;
          color: #aab;
        "
      ></div>
      <div style="margin-top: 10px; font-size: 0.7rem; color: #778">
        Each toggle re-renders immediately. Turning one OFF and seeing an artifact vanish identifies
        the feature responsible.
      </div>
    </div>

    <div id="canvas-wrap"><canvas id="glcanvas" width="800" height="800"></canvas></div>

    <div
      style="
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 8px;
        width: 100%;
        max-width: 720px;
      "
    >
      <label for="bg-color" style="width: auto; font-size: 0.72rem; color: #888; flex-shrink: 0"
        >Background</label
      >
      <input
        id="bg-color"
        type="color"
        value="#ffffff"
        style="
          width: 44px;
          height: 28px;
          padding: 0;
          border: 1px solid #383858;
          border-radius: 6px;
          background: #252535;
          cursor: pointer;
        "
      />
      <button id="bg-white" class="secondary" type="button" style="padding: 6px 10px">White</button>
      <button id="bg-black" class="secondary" type="button" style="padding: 6px 10px">Black</button>
      <button
        id="bg-checker"
        class="secondary"
        type="button"
        style="padding: 6px 10px"
        title="Show a checkerboard behind the canvas to judge translucency"
      >
        Checker
      </button>
    </div>

    <script type="module">
      'use strict';
      window.addEventListener('error', (e) => {
        const st = document.getElementById('status');
        if (st) st.textContent = 'JS error: ' + (e.message || e.error);
        console.error('boot error:', e.error || e);
      });

      import { importSvg, createBundle, createRenderer, loadShaders } from './src/index.js';

      // ============================================================
      // Canvas + GL setup
      // ============================================================
      const canvas = document.getElementById('glcanvas');
      const gl = canvas.getContext('webgl2', {
        premultipliedAlpha: true,
        antialias: false, // MSAA interacts badly with stencil INVERT at shared edges
        stencil: true,
        depth: true,
      });
      if (!gl) {
        document.getElementById('status').textContent = 'WebGL2 not available';
        throw new Error('WebGL2 required');
      }

      // Shader sources: fetched from the package's .glsl files via the
      // shipped loadShaders() helper. Single source of truth — production
      // renderer, the parity tests, and this demo all read the same
      // files, so any edit to mantle.frag.glsl flows here on next reload
      // (GLSL inlined in <script> tags would silently drift from disk).
      // Requires the page be served over http — file:// fetches fail per
      // CORS; any static server (python -m http.server, say) works.
      const shaderSources = await loadShaders(new URL('./src/shaders/', location.href).href);
      const renderer = createRenderer(gl, shaderSources);
      // Headless test surface — Puppeteer-driven smokes (e.g.
      // test/font/colrSpecRenderSmoke.mjs, test/patternUnitsRenderSmoke.mjs) need
      // to trigger a fresh render + read pixels from the SAME tick (the
      // demo's WebGL2 context has preserveDrawingBuffer:false by default).
      window.__mantleRenderer = renderer;
      window.__mantleShaderSources = shaderSources;

      // ---------------------------------------------------------------
      // Engine + optimization controls.
      //
      // Every optimization here is meant to be OUTPUT-IDENTICAL to the plain path.
      // When one isn't, that is a bug — and the fastest way to find which one is to
      // switch them off individually and watch the artifact disappear. Each flag is
      // read at DRAW time (not baked into a bundle), so a toggle takes effect on the
      // next frame with no reload.
      // ---------------------------------------------------------------
      const OPTS = [
        {
          id: 'occlusionCull',
          flag: '__MANTLE_NO_OCCLUSION_CULL',
          label: 'Occlusion cull',
          invert: true,
          hint: 'drop shapes a later opaque shape fully covers',
        },
        {
          id: 'filterBbox',
          flag: '__MANTLE_NO_FILTER_BBOX',
          label: 'Filter bbox RTs',
          invert: true,
          hint: 'restrict filter passes to the propagated bbox',
        },
        {
          id: 'staticCache',
          flag: '__MANTLE_NO_STATIC_CACHE',
          label: 'Static cache',
          invert: true,
          hint: 'bake a static handle to an RT and blit',
        },
        {
          id: 'instancedFast',
          flag: '__MANTLE_NO_INSTANCED_FAST',
          label: 'Instanced fast path',
          invert: true,
          hint: 'one drawArraysInstanced for N copies',
        },
        {
          id: 'occupancy',
          flag: '__MANTLE_NO_OCCUPANCY',
          label: 'Occupancy skip',
          invert: true,
          hint: 'skip the coverage walk on interior pixels',
        },
        {
          id: 'groupRect',
          flag: '__MANTLE_NO_GROUP_RECT',
          label: 'Group/blend rects',
          invert: true,
          hint: "bound a group's snapshot + clear + composite to its content",
        },
      ];
      const optWrap = document.getElementById('opt-toggles');
      for (const o of OPTS) {
        const id = 'opt-' + o.id;
        const row = document.createElement('label');
        row.style.cssText = 'display:flex;gap:6px;align-items:center;cursor:pointer;';
        row.htmlFor = id;
        row.title = o.hint;
        const on = o.on !== false;
        row.innerHTML = `<input type="checkbox" id="${id}"${on ? ' checked' : ''} style="cursor:pointer;"> <span>${o.label}</span>`;
        optWrap.appendChild(row);
        row.querySelector('input').addEventListener('change', (e) => {
          // Most flags are "__MANTLE_NO_x" (checked = optimization on = flag cleared). The
          // filter scissor is opt-IN, so its flag is positive.
          const positive = !o.flag.startsWith('__MANTLE_NO_');
          globalThis[o.flag] = (positive ? e.target.checked : !e.target.checked) ? true : undefined;
          redraw();
        });
      }

      // The COVERAGE ENGINE is chosen by shader #defines, which are baked into the fill program
      // at createRenderer time. So an engine is not a live toggle: each one needs its own
      // renderer, built lazily and cached. (LB is the exception — it is a routing decision, not a
      // coverage kernel, so it toggles on the existing renderer.)
      //
      //   slug      (no defines)            the band walk
      //   aac       MANTLE_AAC              exact analytic area
      //   gwn       MANTLE_GWN + _GWN_SDF   band-free: run-tree winding + tree-derived SDF
      //   hard      MANTLE_HARD             no AA: crossing count -> 0/1
      //   hard-tree MANTLE_HARD + _HARD_TREE no AA via the GWN run tree
      //
      // An engine is TWO decisions, not one. The #defines pick the kernel, but the GWN kernels also
      // need their run TREE, and that is baked by the IMPORTER — importSvg({gwnTree:true}) — into the
      // band texture. Set the define without the tree and the kernel walks a header that was never
      // written: it renders NOTHING (measurably: ink 0). So an engine carries import opts too, and
      // changing to one that needs a different bundle re-imports the SVG.
      const ENGINE_OPTS = {
        slug: null, // the base renderer
        aac: { aacFill: true },
        // MANTLE_GWN alone is the WINDING-ONLY tier (what the hard engines ride). The AA'd
        // GWN+SDF path is gated on MANTLE_GWN_SDF — without it you get GWN's hard fill, not GWN.
        gwn: { fillDefines: ['MANTLE_GWN', 'MANTLE_GWN_SDF'] },
        // MANTLE_GWN is REQUIRED alongside MANTLE_HARD, even though the frag's #if chain reaches
        // renderFillHardBand before any GWN branch. It is what compiles the run-tree kernel in —
        // without it the program fails to link ("renderFillHardBand: no matching overloaded
        // function"). This is the config fillPass itself builds for a no-AA bundle.
        hard: { fillDefines: ['MANTLE_HARD', 'MANTLE_GWN'] },
        'hard-tree': { fillDefines: ['MANTLE_HARD', 'MANTLE_HARD_TREE', 'MANTLE_GWN'] },
      };
      const ENGINE_IMPORT = {
        gwn: { gwnTree: true },
        'hard-tree': { gwnTree: true },
      };
      const importOptsFor = (v) => ({ nativeArcs: true, ...(ENGINE_IMPORT[v] || {}) });
      const currentEngine = () => document.getElementById('eng-sel').value;
      const _engRenderers = new Map();
      function rendererForEngine(v) {
        if (v === 'auto' || v === 'lb' || v === 'lb-only' || v === 'slug') return renderer;
        if (_engRenderers.has(v)) return _engRenderers.get(v);
        const opts = ENGINE_OPTS[v];
        // The GWN and hard engines are compiled in through fillDefines, a test hook createRenderer honors only under
        // __MANTLE_DEBUG__. This is a developer page, so it opens the gate for them.
        if (opts && opts.fillDefines) globalThis.__MANTLE_DEBUG__ = true;
        let r = renderer;
        try {
          r = createRenderer(gl, shaderSources, opts || {});
          r.setLoopBlinnFill('off'); // an engine choice means "use THIS coverage kernel"
        } catch (e) {
          console.warn('[mantle demo] engine', v, 'failed to build a renderer:', e);
          document.getElementById('status').textContent = `engine "${v}" failed: ${e.message}`;
        }
        _engRenderers.set(v, r);
        // A renderer created LATER never saw the overlay toggles. showTriOutline/showBBoxes are
        // per-renderer state and the toggle handler only pushes them to the renderers that exist when
        // you click — so switching to AAC/GWN/hard after turning the overlay on would give you no overlay.
        applyDebugFlags();
        return r;
      }

      const engSel = document.getElementById('eng-sel');
      let _lastSvgText = null; // so an engine change can re-import
      let _lastImportKey = null;
      engSel.addEventListener('change', async () => {
        const v = engSel.value;
        const r = rendererForEngine(v);
        window.__mantleActiveRenderer = r;
        // 'lb' still lets LB DECLINE per bundle and fall back to Slug silently — which is why a
        // shape can look like it is being drawn by an engine that never touched it. 'lb-only' is
        // the forcing mode: no Slug fallback, so what LB cannot draw is simply not drawn, and you
        // can SEE what it declined. (The status line reports the decision either way.)
        if (r === renderer)
          renderer.setLoopBlinnFill(
            v === 'lb' ? 'on' : v === 'lb-only' ? 'only' : v === 'slug' ? 'off' : 'auto',
          );
        // Rebuild the bundle on EVERY engine change, not just when the import opts differ.
        // slug/lb/auto share one renderer, so they share its STATIC CACHE — and the cache is keyed
        // on the bundle, not the engine. Switching slug→lb without a rebuild just re-blits the bake
        // Slug made: identical pixels, no LB draw, and an overlay with nothing to show. The engine
        // picker looked like it did nothing because, for those three, it did nothing.
        if (_lastSvgText) {
          await loadSvgText(_lastSvgText);
          return;
        }
        if (bundle) {
          try {
            r.setBundle(bundle);
          } catch {}
        }
        redraw();
      });

      // The ONE load path: import under the current engine's opts, bind, draw.
      async function loadSvgText(text, label) {
        const v = currentEngine();
        _lastSvgText = text;
        _lastImportKey = JSON.stringify(importOptsFor(v));
        const sections = await importSvg(text, importOptsFor(v));
        setBundle(createBundle(gl, sections), label ? ' — ' + label : '');
        // LB builds its meshes OFF the main thread, so the first frames after a load are Slug even
        // with LB selected — which made "Loop-Blinn" show you pixel-identical Slug output and no way
        // to tell. Wait for the meshes before painting the frame the engine picker promised.
        const R = window.__mantleActiveRenderer || renderer;
        if (bundle && R.awaitLbReady && (v === 'lb' || v === 'lb-only' || v === 'auto')) {
          try {
            await R.awaitLbReady(bundle);
          } catch {}
        }
        redraw();
      }
      window.__mantleLoadSvg = loadSvgText;
      window.__mantleActiveRenderer = renderer;

      // Resolution scale: render fewer pixels at the same on-screen size. Fill cost is linear in
      // backing-store pixels, so this is the direct dial on frame time.
      const resSlider = document.getElementById('res-scale');
      const resLabel = document.getElementById('res-scale-v');
      resSlider.addEventListener('input', () => {
        const s = Number(resSlider.value);
        const R = window.__mantleActiveRenderer || renderer;
        const size = R.setResolutionScale ? R.setResolutionScale(s) : null;
        resLabel.textContent = `${s.toFixed(2)}×` + (size ? ` (${size[0]}×${size[1]})` : '');
        redraw();
      });

      // The canvas is displayed 1:1 with its backing store — see the CSS. An 800x800 buffer shown in
      // a smaller box would be resampled by the browser every frame before you saw it, and a resampled
      // edge tells you nothing about the antialiasing that produced it. This page exists to judge
      // exactly that.
      //
      // The CSS shows it at 800 CSS px rather than shrinking the buffer to the box: many smokes drive
      // this page and read its canvas, and they set small headless viewports. Sizing the buffer to the
      // box would silently render every one of them far below 800 px, measuring something other than
      // what they were written to measure.
      function warnIfResampled() {
        const scale = canvas.clientWidth
          ? canvas.width / (canvas.clientWidth * (devicePixelRatio || 1))
          : 1;
        return Math.abs(scale - 1) > 0.01
          ? ` — NOTE: canvas ${canvas.width}px shown at ${Math.round(canvas.clientWidth * (devicePixelRatio || 1))}px, so edges you see are RESAMPLED (widen the window to judge AA)`
          : '';
      }

      // What actually painted this frame? An engine can DECLINE (LB falls back to Slug per bundle,
      // and defers loop/cusp/arc "sentinel" shapes even when it takes the bundle), so the picker's
      // value is a request, not a report.
      function routeReport(R, b) {
        if (!b) return '';
        const lb = b._lbMeshes || [];
        const analytic = lb.filter((m) => m && m.vertexCount && !m.fallback).length;
        const deferred = lb.filter((m) => !m || !m.vertexCount).length;
        const routed = R.debugStats && R.debugStats.loopBlinnRouteCount > (routeReport._last || 0);
        routeReport._last = (R.debugStats && R.debugStats.loopBlinnRouteCount) || 0;
        const v = currentEngine();
        if (v !== 'lb' && v !== 'lb-only' && v !== 'auto') return '';
        const forced = v === 'lb-only';
        if (!lb.length)
          return forced
            ? ' — LB DECLINED the bundle: nothing drawn (force mode, no Slug fallback)'
            : ' — LB DECLINED the bundle (Slug drew it)';
        return (
          ` — LB ${routed ? 'routed' : forced ? 'DECLINED: nothing drawn' : 'DECLINED (Slug drew it)'}: ` +
          `${analytic}/${lb.length} shapes analytic` +
          (deferred ? `, ${deferred} deferred to Slug (loop/cusp sentinel)` : '')
        );
      }

      // Frame clear color, driven by the Background control. A checkerboard is drawn in CSS behind
      // the canvas, so for it we clear TRANSPARENT and let the checker show through the letterbox and
      // wherever the content is translucent. Checker is the DEFAULT (matches #canvas-wrap's CSS), so
      // translucency is visible out of the box.
      let bgColor = [0, 0, 0, 0];
      function redraw() {
        const R = window.__mantleActiveRenderer || renderer;
        try {
          if (typeof render === 'function') render(R);
          else if (bundle) {
            R.beginFrame(bgColor);
            R.drawBundle(bundle);
            R.endFrame();
          }
          const st = document.getElementById('status');
          const base = st.textContent.split(' — LB ')[0].split(' — NOTE:')[0];
          st.textContent = base + routeReport(R, bundle) + warnIfResampled();
        } catch (e) {
          console.warn('[mantle demo] redraw failed:', e);
        }
      }
      window.__mantleRedraw = redraw;
      // smokes that need a renderer with different opts (e.g. aacFill)
      window.__mantleGl = gl;
      window.__mantleGetBundle = () => bundle; // current bound bundle (or null)

      // Current bundle. Released + replaced on each SVG load.
      let bundle = null;
      function setBundle(newBundle, statusSuffix) {
        if (bundle) bundle.dispose();
        bundle = newBundle;
        renderer.setBundle(bundle);
        // An engine other than slug/lb/auto runs on its OWN renderer (the coverage kernel is a
        // shader #define). It has never seen this bundle — tell it, or loading a new SVG while a
        // non-default engine is selected silently keeps drawing the previous one.
        const _act = window.__mantleActiveRenderer;
        if (_act && _act !== renderer) {
          try {
            _act.setBundle(bundle);
          } catch {}
        }
        if (bundle) {
          const hv = bundle.hybridVerts;
          document.getElementById('status').textContent =
            'Loaded ' +
            bundle.numShapes +
            ' shapes' +
            (hv ? ', cover mesh ' + hv + ' verts' : '') +
            (statusSuffix || '');
        } else {
          document.getElementById('status').textContent = 'Cleared' + (statusSuffix || '');
        }
        renderer.render();
      }

      // ============================================================
      // SVG load — file picker + URL boot
      // ============================================================
      // ---------------------------------------------------------------
      // Smoke-suite assets. examples/smoke/index.json is written by the extractor and lists
      // every SVG the tests render, with the smoke and the const it came from — so when a smoke
      // fails you can open the exact asset here and drive it through every engine and toggle.
      // ---------------------------------------------------------------
      (async function fillSmokePicker() {
        const sel = document.getElementById('smoke-sel');
        const gEx = document.getElementById('grp-examples');
        const gSm = document.getElementById('grp-smoke');
        const grab = async (u) => {
          try {
            const r = await fetch(u);
            return r.ok ? await r.json() : [];
          } catch {
            return [];
          }
        };
        // TWO groups. The smoke fixtures are deliberately TINY — the biggest is 12 elements,
        // because a test wants one thing isolated. The real scenes live in examples/ (tiger.svg
        // is 240 paths), and those are what you want when you are looking at fill rate or
        // batching, so they belong in the same picker.
        const [examples, smoke] = await Promise.all([
          grab('./examples/index.json'),
          grab('./examples/smoke/index.json'),
        ]);
        for (const a of examples) {
          const o = document.createElement('option');
          o.value = './examples/' + a.file;
          o.textContent = `${a.file}  (${a.elements} shape${a.elements === 1 ? '' : 's'})`;
          gEx.appendChild(o);
        }
        for (const a of smoke) {
          const o = document.createElement('option');
          o.value = './examples/smoke/' + a.file;
          o.textContent = `${a.smoke.replace(/Smoke\.mjs$/, '')} · ${a.const}${a.generated ? '  (generated)' : ''}`;
          gSm.appendChild(o);
        }
        const total = examples.length + smoke.length;
        if (!total) {
          sel.disabled = true;
          sel.options[0].textContent = '— no assets found —';
          return;
        }
        sel.options[0].textContent = `— ${examples.length} examples + ${smoke.length} smoke assets —`;
        sel.addEventListener('change', async () => {
          if (!sel.value) return;
          const status = document.getElementById('status');
          try {
            status.textContent = 'Loading ' + sel.value + ' …';
            await loadSvgText(await (await fetch(sel.value)).text());
          } catch (e) {
            status.textContent = 'Failed to load ' + sel.value + ': ' + e.message;
            console.warn('[mantle demo]', e);
          }
        });
      })();

      document.getElementById('svg-btn').addEventListener('click', async () => {
        const status = document.getElementById('status');
        try {
          const svgIn = document.getElementById('svg-file');
          if (!svgIn.files || !svgIn.files[0]) {
            status.textContent = 'Choose an .svg file to convert.';
            return;
          }
          status.textContent = 'Converting SVG …';
          await loadSvgText(await svgIn.files[0].text());
        } catch (e) {
          document.getElementById('status').textContent =
            'SVG export: ' + String(e && e.message ? e.message : e);
          console.error(e);
        }
      });

      // ============================================================
      // Debug toggles (route through renderer flags)
      // ============================================================
      // showTriOutline/showBBoxes are PER-RENDERER state, and every engine but slug/lb/auto runs on
      // its own renderer — so setting them on `renderer` left the overlay off for aac/gwn/hard. Keep
      // one desired value and push it to whichever renderer is live (including ones built later).
      const _dbg = { tri: false, bbox: false };
      function applyDebugFlags() {
        for (const r of [renderer, ..._engRenderers.values()]) {
          r.showTriOutline = _dbg.tri;
          r.showBBoxes = _dbg.bbox;
        }
        document.getElementById('debug-tri').classList.toggle('active', _dbg.tri);
        document.getElementById('debug-bbox').classList.toggle('active', _dbg.bbox);
      }
      window.__mantleApplyDebugFlags = applyDebugFlags;
      document.getElementById('debug-tri').addEventListener('click', () => {
        _dbg.tri = !_dbg.tri;
        applyDebugFlags();
        redraw();
      });
      document.getElementById('debug-bbox').addEventListener('click', () => {
        _dbg.bbox = !_dbg.bbox;
        applyDebugFlags();
        redraw();
      });
      // ---- Background color ----
      const _wrap = document.getElementById('canvas-wrap');
      const _checkerCss =
        'conic-gradient(#d8d8e0 90deg, #f4f4f8 90deg 180deg, #d8d8e0 180deg 270deg, #f4f4f8 270deg) 0 0 / 20px 20px';
      const _hexToRgba = (h) => [
        parseInt(h.slice(1, 3), 16) / 255,
        parseInt(h.slice(3, 5), 16) / 255,
        parseInt(h.slice(5, 7), 16) / 255,
        1,
      ];
      function setBg(rgba, cssBehind, activeId) {
        bgColor = rgba;
        // The canvas letterbox shows through wherever the fit leaves margin, and (for the checker /
        // a transparent clear) through the content itself — so paint the wrap to match the clear.
        _wrap.style.background = cssBehind;
        for (const id of ['bg-white', 'bg-black', 'bg-checker'])
          document.getElementById(id).classList.toggle('active', id === activeId);
        redraw();
      }
      document.getElementById('bg-color').addEventListener('input', (e) => {
        setBg(_hexToRgba(e.target.value), e.target.value, null); // custom color: no preset is active
      });
      document.getElementById('bg-white').addEventListener('click', () => {
        document.getElementById('bg-color').value = '#ffffff';
        setBg([1, 1, 1, 1], '#fff', 'bg-white');
      });
      document.getElementById('bg-black').addEventListener('click', () => {
        document.getElementById('bg-color').value = '#000000';
        setBg([0, 0, 0, 1], '#000', 'bg-black');
      });
      document.getElementById('bg-checker').addEventListener('click', () => {
        setBg([0, 0, 0, 0], _checkerCss, 'bg-checker'); // transparent clear ⇒ the checker shows through
      });
      document.getElementById('bg-checker').classList.add('active'); // checker is the default
      // ============================================================
      // Benchmark
      // ============================================================
      let benchLock = false;
      function renderBenchFrame(i, N) {
        // Small Lissajous pan so the user sees motion during the bench.
        const u = N > 1 ? (i / (N - 1)) * Math.PI * 2 * 2 : 0;
        const panX = Math.sin(u) * bundle.globalBBox[2] * 0.05;
        const panY = Math.cos(u * 0.73) * bundle.globalBBox[3] * 0.05;
        const orig = [bundle.globalBBox[0], bundle.globalBBox[1]];
        bundle.globalBBox[0] = orig[0] + panX;
        bundle.globalBBox[1] = orig[1] + panY;
        // globalBBox feeds uGBB + uCanvasAR; renderer normally caches
        // both per (asset, canvas-size) so invalidate explicitly for the
        // bench's per-frame pan.
        renderer.invalidateRenderState();
        renderer.render();
        bundle.globalBBox[0] = orig[0];
        bundle.globalBBox[1] = orig[1];
      }

      document.getElementById('bench-btn').addEventListener('click', async () => {
        if (benchLock) return;
        if (!bundle) {
          document.getElementById('status').textContent = 'Load an SVG first.';
          return;
        }
        benchLock = true;
        const btn = document.getElementById('bench-btn');
        btn.disabled = true;
        try {
          const N = Math.max(
            1,
            Math.min(20000, parseInt(document.getElementById('bench-n').value, 10) || 200),
          );
          const status = document.getElementById('status');
          const coverVerts = bundle.hybridVerts;

          status.textContent = 'Benchmarking ' + N + ' frames (visible)…';
          await new Promise((r) => requestAnimationFrame(r));

          // Warmup so shader programs + VBOs + FBOs are resident.
          for (let i = 0; i < 2; i++) renderer.render();
          gl.finish();

          const raf = () => new Promise((resolve) => requestAnimationFrame(resolve));
          const t0 = performance.now();
          let cpuSubmit = 0;
          for (let i = 0; i < N; i++) {
            await raf();
            const tF0 = performance.now();
            renderBenchFrame(i, N);
            cpuSubmit += performance.now() - tF0;
            if ((i & 31) === 0) {
              status.textContent = 'Benchmarking ' + (i + 1) + '/' + N + '…';
            }
          }
          const rb = new Uint8Array(4);
          gl.flush();
          gl.finish();
          gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, rb);
          const t1 = performance.now();

          const wallMs = t1 - t0;
          const cpuAvg = cpuSubmit / N;
          const wallAvg = wallMs / N;
          const fps = wallAvg > 0 ? 1000 / wallAvg : 0;
          const passLabel = coverVerts
            ? bundle.numShapes + ' shapes (cover mesh ' + coverVerts + ' verts)'
            : bundle.numShapes + ' shapes';
          status.textContent =
            'Benchmark: ' +
            passLabel +
            ' — ' +
            N +
            ' rAF frames. ' +
            'CPU/frame ' +
            cpuAvg.toFixed(3) +
            ' ms, ' +
            'wall/frame ' +
            wallAvg.toFixed(3) +
            ' ms (~' +
            fps.toFixed(0) +
            ' FPS incl. vsync). ' +
            'Total wall ' +
            wallMs.toFixed(0) +
            ' ms.';
          renderer.render();
        } finally {
          benchLock = false;
          btn.disabled = false;
        }
      });

      // ============================================================
      // Boot — URL query params
      // ============================================================
      (async function boot() {
        const status = document.getElementById('status');
        const params = new URLSearchParams(location.search);
        const svgUrl = params.get('svg');
        if (svgUrl) {
          status.textContent = 'Fetching + converting ' + svgUrl + ' …';
          try {
            const r = await fetch(svgUrl);
            if (!r.ok) throw new Error('HTTP ' + r.status);
            const isSvgz = /\.svgz(\?|$)/i.test(svgUrl);
            let text;
            if (isSvgz) {
              const ab = await r.arrayBuffer();
              const ds = new DecompressionStream('gzip');
              const stream = new Blob([ab]).stream().pipeThrough(ds);
              text = await new Response(stream).text();
            } else {
              text = await r.text();
            }
            await loadSvgText(text);
          } catch (e) {
            status.textContent = 'SVG URL load: ' + (e && e.message ? e.message : e);
            console.error(e);
          }
        } else {
          status.textContent = 'Choose an SVG file below to begin.';
        }
        if (params.get('tri') === '1') {
          renderer.showTriOutline = true;
          document.getElementById('debug-tri').classList.add('active');
          renderer.render();
        }
        if (params.get('bbox') === '1') {
          renderer.showBBoxes = true;
          document.getElementById('debug-bbox').classList.add('active');
          renderer.render();
        }
        const hqParam = params.get('hq');
        if (hqParam) {
          const sz = parseInt(hqParam, 10);
          if (sz >= 256 && sz <= 8192) {
            canvas.width = sz;
            canvas.height = sz;
            renderer.render();
          }
        }
        if (params.get('bench') === '1') {
          setTimeout(() => document.getElementById('bench-btn').click(), 120);
        }

        // ============================================================
        // Headless text-render entry. Puppeteer (test/font/visualBreadth.mjs)
        // drives the page via this hook:
        //
        //   await page.evaluate((ttfBytes, markup, opts) =>
        //     window.mantleRenderText(ttfBytes, markup, opts),
        //     Array.from(ttfBytes), 'Hello, World!', { fontSizePx: 96 });
        //
        // ttfBytes : ArrayBuffer or array of byte values (serializable across
        //            the Puppeteer page boundary).
        // markup   : TMP-style string (see font/markupParser.js).
        // opts     : { fontSizePx?, defaultColor? (3-tuple 0..1), maxWidthEm?,
        //              align?: 'left'|'center'|'right', lineHeightEm? }
        //
        // Returns: { numShapes, bbox: [xmin,ymin,xmax,ymax] } once the draw
        // has flushed. Puppeteer can then await this promise, screenshot,
        // and exit. The font/textRun modules are loaded on first call.
        // ============================================================
        window.mantleRenderText = async function (ttfBytes, markup, opts) {
          opts = opts || {};
          const [fontMod, runMod] = await Promise.all([
            import('./src/font/fontAsset.js'),
            import('./src/font/textRun.js'),
          ]);
          const rawBytes =
            ttfBytes instanceof Uint8Array
              ? ttfBytes
              : ttfBytes instanceof ArrayBuffer
                ? new Uint8Array(ttfBytes)
                : new Uint8Array(ttfBytes); // Array.from() result
          // Transparently decode woff2 → sfnt before constructing the
          // font asset. No-op on TTF/OTF input.
          const bytes = await fontMod.decodeIfWoff2(rawBytes);
          const font = new fontMod.MantleFontAsset(bytes);
          const defColor = opts.defaultColor || [0, 0, 0, 1];
          const layout = {
            maxWidthEm: opts.maxWidthEm || 0,
            align: opts.align || 'left',
            lineHeightEm: opts.lineHeightEm || 0,
          };
          // Probe-build to learn the bbox, then rebuild with a translation
          // that makes the bbox origin sit at (0,0). globalBBox is
          // (xmin, ymin, width, height) — matches SVG bundles + shader's
          // uGlobalBBox.
          let b = await runMod.buildFromMarkup(markup, font, defColor, layout);
          const [bbXmin, bbYmin] = b.globalBBox;
          if (bbXmin !== 0 || bbYmin !== 0) {
            const shifted = Object.assign({}, layout, {
              originX: -bbXmin,
              originY: -bbYmin,
            });
            b = await runMod.buildFromMarkup(markup, font, defColor, shifted);
          }

          // The engine package consumes a `sections` dict (createBundle /
          // createRenderer). Curves and bands have NO header — raw Float32 stream
          // of 4-float texels. The meta section IS prefixed with a
          // 32-byte header that parseMetaBin reads; textRun doesn't emit
          // it (runtime bridges reconstruct from struct fields), so
          // prepend it here.
          const curveAb = b.curveTexels.buffer.slice(
            b.curveTexels.byteOffset,
            b.curveTexels.byteOffset + b.curveTexels.byteLength,
          );
          const bandAb = b.bandTexels.buffer.slice(
            b.bandTexels.byteOffset,
            b.bandTexels.byteOffset + b.bandTexels.byteLength,
          );
          const metaAb = new ArrayBuffer(32 + b.metaFloats.byteLength);
          const mdv = new DataView(metaAb);
          mdv.setUint32(0, b.numShapes, true);
          mdv.setFloat32(4, b.globalBBox[0], true);
          mdv.setFloat32(8, b.globalBBox[1], true);
          mdv.setFloat32(12, b.globalBBox[2], true);
          mdv.setFloat32(16, b.globalBBox[3], true);
          new Uint8Array(metaAb, 32).set(
            new Uint8Array(b.metaFloats.buffer, b.metaFloats.byteOffset, b.metaFloats.byteLength),
          );
          // curveGeom = per-shape OBB cover-quad chunks (one per glyph).
          const cgeomAb =
            b.curveGeomFloats && b.curveGeomFloats.byteLength
              ? b.curveGeomFloats.buffer.slice(
                  b.curveGeomFloats.byteOffset,
                  b.curveGeomFloats.byteOffset + b.curveGeomFloats.byteLength,
                )
              : null;
          const sections = {
            flags: b.flags,
            metaFloatsPerShape: b.metaFloatsPerShape,
            meta: metaAb,
            curves: curveAb,
            bands: bandAb,
            curveGeom: cgeomAb,
            // textRun produces no gradients / dashes / images / filters.
            gradients: null,
            gradientRamp: null,
            dashes: null,
            strokeMesh: null,
            clipMesh: null,
            maskMesh: null,
            filterTab: null,
            imageAtlas: null,
            imageAtlasDim: null,
            // COLRv1: forward the per-glyph paint-graph table + run-wide
            // stops LUT + per-shape ids so createBundle wires them and the
            // renderer's COLR branch fires for color-emoji input. Null for
            // monochrome runs (the common case) — bridge keeps the
            // pass-through behavior.
            colrGraphs: b.colrGraphs || null,
            gradientStops: b.gradientStops || null,
            gradientStopsCount: b.gradientStopsCount || 0,
            shapeIds: b.shapeIds || null,
          };
          // Guard against zero-shape runs (font has no glyph for any input
          // codepoint) — createBundle's per-shape texture sizing assumes at
          // least one shape and otherwise tries to texImage2D buffers that
          // don't match the expected RGBA32F size. Treat as a clear/no-op.
          let bundle = null;
          if (b.numShapes > 0) {
            bundle = createBundle(gl, sections);
            setBundle(bundle, ' (text)');
          } else {
            setBundle(null, ' (text: empty)');
          }
          // Diagnostic surface (read by test/font/colrSpecRenderSmoke.mjs): expose
          // the per-bundle colrGraphs count + per-shape colrGraphId values so
          // the smoke can verify the dispatch wiring without parsing pixels.
          window.__mantleLastTextDiag = {
            numShapes: b.numShapes,
            colrGraphsCount: (b.colrGraphs && b.colrGraphs.length) | 0,
            colrGraphIds: Array.from({ length: b.numShapes }, (_, i) =>
              Math.floor((b.metaFloats[i * b.metaFloatsPerShape + 45] || 0) + 0.5),
            ),
            flagsShape: Array.from({ length: b.numShapes }, (_, i) =>
              Math.floor((b.metaFloats[i * b.metaFloatsPerShape + 27] || 0) + 0.5),
            ),
            drawListLen: bundle ? bundle.drawList.length : 0,
            drawListSlugOps: bundle
              ? bundle.drawList.filter((op) => op.kind === 'slugShape').length
              : 0,
            drawListColrOps: bundle
              ? bundle.drawList.filter((op) => op.kind === 'slugShape' && op.colrGraphId > 0).length
              : 0,
            curveLen: bundle && bundle.curveFloats ? bundle.curveFloats.length : -1,
            globalBBox: b.globalBBox,
          };

          // Force a synchronous render. The demo's WebGL2 context was
          // created WITHOUT preserveDrawingBuffer, so the back buffer is
          // implementation-defined after present. We re-render right before
          // returning and capture pixels into window.__mantleLastFrame so
          // Puppeteer can read them without racing the GPU clear.
          renderer.render();
          {
            const cnv = document.getElementById('glcanvas');
            const w = cnv.width,
              h = cnv.height;
            const px = new Uint8Array(w * h * 4);
            gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
            window.__mantleLastFrame = { w, h, data: px };
          }
          return { numShapes: b.numShapes, bbox: b.globalBBox };
        };
        // Tell Puppeteer / human users that the hook is ready.
        window.mantleTextReady = true;
      })();
    </script>
  </body>
</html>
