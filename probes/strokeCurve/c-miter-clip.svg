<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Miter-clip past the limit. The join is past its limit; SVG 2 cuts it square to the BISECTOR at miterLimit * halfW, not square to the tangent. -->
  <rect width="200" height="200" fill="#ffffff"/>
  <path d="M 30 170 Q 70 60 100 100 Q 130 60 170 170" fill="none" stroke="#000000" stroke-width="20" stroke-linecap="butt" stroke-linejoin="miter-clip" stroke-miterlimit="1"/>
</svg>
