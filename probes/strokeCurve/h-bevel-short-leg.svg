<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Bevel join, short leg. The same path with a bevel join: the chord bounds the OUTER side of the join only, so the disc behind the incoming perpendicular must go here too. -->
  <rect width="200" height="200" fill="#ffffff"/>
  <path d="M 92 100 Q 96 100 100 100 Q 122 132 112 170" fill="none" stroke="#000000" stroke-width="28" stroke-linecap="butt" stroke-linejoin="bevel" stroke-miterlimit="4"/>
</svg>
