<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Arcs between curved segments, past the miter limit: SVG 2 clips the region rather than beveling. -->
  <rect width="200" height="200" fill="#ffffff"/>
  <path d="M 30 150 Q 80 40 100 100 Q 120 160 170 50" fill="none" stroke="#000000" stroke-width="16" stroke-linecap="butt" stroke-linejoin="arcs" stroke-miterlimit="1"/>
</svg>
