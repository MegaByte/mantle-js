    <circle cx="13.000" cy="160.333" r="5"/><circle cx="94.137" cy="160.719" r="5"/><circle cx="175.274" cy="161.105" r="5"/><circle cx="256.000" cy="160.526" r="5"/><circle cx="337.137" cy="160.912" r="5"/><circle cx="418.274" cy="160.333" r="5"/><circle cx="499.000" cy="160.719" r="5"/>
    <circle cx="14.000" cy="238.000" r="6"/><circle cx="94.804" cy="238.386" r="6"/><circle cx="175.607" cy="238.772" r="6"/><circle cx="256.000" cy="238.193" r="6"/><circle cx="336.804" cy="238.579" r="6"/><circle cx="417.607" cy="238.000" r="6"/><circle cx="498.000" cy="238.386" r="6"/>
    <circle cx="16.000" cy="318.667" r="8"/><circle cx="96.137" cy="319.053" r="8"/><circle cx="176.274" cy="319.439" r="8"/><circle cx="256.000" cy="318.860" r="8"/><circle cx="336.137" cy="319.246" r="8"/><circle cx="416.274" cy="318.667" r="8"/><circle cx="496.000" cy="319.053" r="8"/>
    <circle cx="18.000" cy="403.333" r="10"/><circle cx="97.470" cy="403.719" r="10"/><circle cx="176.941" cy="404.105" r="10"/><circle cx="256.000" cy="403.526" r="10"/><circle cx="335.470" cy="403.912" r="10"/><circle cx="414.941" cy="403.333" r="10"/><circle cx="494.000" cy="403.719" r="10"/>
    <circle cx="20.000" cy="492.000" r="12"/><circle cx="98.804" cy="492.386" r="12"/><circle cx="177.607" cy="492.772" r="12"/><circle cx="256.000" cy="492.193" r="12"/><circle cx="334.804" cy="492.579" r="12"/><circle cx="413.607" cy="492.000" r="12"/><circle cx="492.000" cy="492.386" r="12"/>
  </g>
