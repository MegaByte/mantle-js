<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <filter id="s" x="-50%" y="-50%" width="200%" height="200%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="400" height="400" fill="#3d566e"/>
  <circle cx="120" cy="300" r="90" fill="#e67e22"/>
  <g opacity="0.55">
    <rect x="270" y="40" width="90" height="70" fill="#ecf0f1" stroke="#c0392b" stroke-width="14"/>
    <circle cx="315" cy="150" r="34" fill="#1abc9c" filter="url(#s)"/>
  </g>
  <!-- A BLENDED LEAF, outside any group. It takes its own offscreen route and would pay the
       same four full-canvas passes; the rect bounds those too. -->
  <circle cx="80" cy="90" r="55" fill="#f39c12" style="mix-blend-mode: multiply"/>
  <!-- ...and one INSIDE a group, which composites against the group's local backdrop
       rather than the canvas — a different branch of the same code. -->
  <g opacity="0.8">
    <rect x="180" y="330" width="150" height="55" rx="10" fill="#9b59b6"/>
    <rect x="215" y="345" width="80" height="30" fill="#2ecc71" style="mix-blend-mode: screen"/>
  </g>
</svg>
