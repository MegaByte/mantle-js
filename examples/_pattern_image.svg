<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Vector pattern containing an <image> child: 32x32 quadrant PNG tiled.
         Each tile shows R/G/B/Y in 2x2 layout. -->
    <pattern id="imgpat" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <image x="0" y="0" width="40" height="40"
             href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAIAAAD8GO2jAAAAQElEQVR4nO3UsQ0AAAgCQXD/nXUEYmHlX29IvtCtHS8PSseKgYREEYkiEj1IZGn34Lv9LFExkJAoIlFEoug80QBLigU8WcCZSQAAAABJRU5ErkJggg=="/>
    </pattern>
  </defs>
  <!-- 4x4 tile arrangement: 160x160 rect filled with the image pattern. -->
  <rect x="20" y="20" width="160" height="160" fill="url(#imgpat)"/>
</svg>
