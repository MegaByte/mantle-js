<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="gradH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="red"/>
      <stop offset="100%" stop-color="blue"/>
    </linearGradient>
    <radialGradient id="gradR" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="yellow"/>
      <stop offset="100%" stop-color="green"/>
    </radialGradient>
    <!-- Vector pattern with gradient-filled children:
         tile (40x40) with a linear-gradient rect and a radial-gradient circle. -->
    <pattern id="gradpat" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="url(#gradH)"/>
      <circle cx="20" cy="20" r="12" fill="url(#gradR)"/>
    </pattern>
  </defs>
  <!-- 4x4 tile arrangement: 160x160 rect filled with gradpat -->
  <rect x="20" y="20" width="160" height="160" fill="url(#gradpat)"/>
</svg>
