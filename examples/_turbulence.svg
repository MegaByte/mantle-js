<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
  <defs>
    <!-- Pure turbulence: feTurbulence is a generator (no inputs); we then
         clip it to the shape silhouette with feComposite-in so the noise
         only appears inside our circle. -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" seed="1"
                    result="noise"/>
      <feComposite in="noise" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <rect width="300" height="200" fill="white"/>
  <circle cx="150" cy="100" r="80" fill="black" filter="url(#noise)"/>
</svg>
